<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio | Alfred Leigh - Mechatronics Engineer</title>
    <script>
      // GitHub Pages SPA redirect: encode the current path into a query string
      // on /index.html so BrowserRouter can restore it after load.
      // See: https://github.com/rafgraph/spa-github-pages
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.redirect = path;
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
