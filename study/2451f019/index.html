<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Study Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090c'/%3E%3Crect x='10' y='10' width='12' height='12' rx='2' fill='%23c8ff4d' transform='rotate(45 16 16)'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
:root{--bg:#08090c;--panel:#0f1116;--line:#1e222b;--tx:#eef1f6;--dim:#8a93a8;--dim2:#5c6477;--acc:#c8ff4d;
  --red:#ff5c7a;--amber:#ffc14d;--green:#3ddc84;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0;display:flex;align-items:center;gap:9px}
.mark{width:9px;height:9px;background:var(--acc);border-radius:2px;transform:rotate(45deg)}
.sub{color:var(--dim);font-size:12.5px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#aab2c5;margin:0 0 10px}
button{font:inherit;color:inherit;background:#141720;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
button.primary{background:var(--acc);color:#0b0d08;border-color:var(--acc);font-weight:600;width:100%}
input{font:inherit;color:inherit;background:#0b0d12;border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
label{display:block;font-size:12.5px;color:var(--dim);margin:14px 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #171b23}
.row:last-child{border-bottom:0}
.rag{width:10px;height:10px;border-radius:50%;flex:none;background:#2a3040}
.rag.red{background:var(--red)}.rag.amber{background:var(--amber)}.rag.green{background:var(--green)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:500;font-size:14.5px}
.nm small{display:block;color:var(--dim2);font-size:12px}
.tag{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.ragbar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:#1b1f28;margin-top:6px}
.ragbar i{display:block;height:100%}
.ragbar i.green{background:var(--green)}.ragbar i.amber{background:var(--amber)}.ragbar i.red{background:var(--red)}.ragbar i.none{background:#2a3040}
details{border-bottom:1px solid #171b23}
details:last-child{border-bottom:0}
summary{display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .nm b{font-size:14.5px}
.topics{padding:0 0 10px 6px}
.note{color:#9aa4ba;font-size:12.5px;background:#12151c;border-left:2px solid #5ae6c8;border-radius:0 6px 6px 0;padding:5px 9px;margin:4px 0 2px;white-space:pre-wrap}
.cds{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;white-space:nowrap}
.cd b{font-family:var(--mono);font-size:18px;color:var(--acc)}
.cd span{color:var(--dim);font-size:12px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(11,13,17,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
nav button{flex:1;border:0;background:0;border-radius:0;padding:13px 4px 14px;color:var(--dim);font-size:12.5px}
nav button.on{color:var(--acc)}
.hint{color:var(--dim2);font-size:12px}
.err{color:#ff8fa5;font-size:13px;margin-top:10px}
.empty{color:var(--dim2);font-size:13px;padding:8px 0}
.right{text-align:right}
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1><span class="mark"></span>Study Tracker</h1>
  <div class="sub" id="sub">Read-only copy</div>
  <div class="card" id="gate">
    <h2>Locked</h2>
    <p class="hint">This copy is encrypted. Enter your password to read it on this device.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" enterkeyhint="go">
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" id="remember" style="width:auto"> Remember on this device</label>
    <div style="margin-top:14px"><button class="primary" id="go">Unlock</button></div>
    <div class="err" id="err" hidden></div>
  </div>
  <div id="main" hidden></div>
</div>
<nav id="nav" hidden>
  <button data-tab="due" class="on">Due</button>
  <button data-tab="subjects">Subjects</button>
  <button data-tab="week">Week</button>
</nav>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const SNAPSHOT_URL = 'https://gist.githubusercontent.com/a365l/ed47df7859df67c643956bc0ecd27231/raw/snapshot.json';   /* filled in when the page is published */
const KEY = 'study-tracker-pw';
let DATA = null, tab = 'due';

function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h} hour${h === 1 ? '' : 's'} ago` : `${Math.round(h / 24)} day${Math.round(h / 24) === 1 ? '' : 's'} ago`;
}
const fmtMins = m => (m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ''}`);

async function decrypt(password, blob) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64d(blob.salt), iterations: blob.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(blob.iv) }, key, b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function load(password, remember) {
  const err = $('#err');
  err.hidden = true;
  try {
    const res = await fetch(`${SNAPSHOT_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Couldn't fetch the data (${res.status})`);
    const blob = await res.json();
    DATA = await decrypt(password, blob);
    if (remember) { try { localStorage.setItem(KEY, password); } catch {} }
    $('#gate').hidden = true; $('#main').hidden = false; $('#nav').hidden = false;
    $('#sub').textContent = `Read-only · updated ${ago(DATA.at)}`;
    render();
  } catch (e) {
    try { localStorage.removeItem(KEY); } catch {}
    err.hidden = false;
    err.textContent = /fetch|status/i.test(e.message) ? e.message : 'Wrong password, or the data is damaged.';
  }
}

function ragBar(c) {
  const total = (c.green + c.amber + c.red + c.none) || 1;
  return `<div class="ragbar">${[['green', c.green], ['amber', c.amber], ['red', c.red], ['none', c.none]]
    .map(([k, n]) => (n ? `<i class="${k}" style="width:${n / total * 100}%"></i>` : '')).join('')}</div>`;
}
const counts = topics => topics.reduce((c, t) => { c[t.rag || 'none']++; return c; }, { red: 0, amber: 0, green: 0, none: 0 });
const STAGE = ['', 'taught', 'notes', 'practised', 'confident'];

function viewDue() {
  const due = DATA.due || [];
  return `${(DATA.exams || []).length ? `<div class="cds">${DATA.exams.map(e => `<div class="cd"><b>${e.days}</b><span>${esc(e.name)}</span></div>`).join('')}</div>` : ''}
  <div class="card"><h2>Due for review</h2>
    ${due.length ? due.map(d => `<div class="row"><span class="rag ${d.rag}"></span>
      <span class="nm"><b>${esc(d.name)}</b><small>${esc(d.subject)} · ${esc(d.unit)}</small></span>
      <span class="tag">${d.overdue > 0 ? `${d.overdue}d over` : 'today'}</span></div>`).join('')
      : '<div class="empty">Nothing due. Nice.</div>'}</div>
  <div class="card"><h2>Red and amber</h2>
    ${(DATA.weak || []).length ? DATA.weak.map(d => `<div class="row"><span class="rag ${d.rag}"></span>
      <span class="nm"><b>${esc(d.name)}</b><small>${esc(d.subject)} · ${esc(d.unit)}</small></span></div>`).join('')
      : '<div class="empty">Nothing red or amber.</div>'}</div>`;
}

function viewSubjects() {
  return DATA.subjects.map(s => `<div class="card"><h2>${esc(s.name)}</h2>
    ${s.courses.map(c => c.units.map(u => {
      const c2 = counts(u.topics);
      return `<details><summary><span class="nm"><b>${esc(u.name)}</b><small>${esc(c.name)} · Year ${u.year}${u.due ? ` · ${u.due} due` : ''}</small>${ragBar(c2)}</span></summary>
        <div class="topics">${u.topics.map(t => `<div class="row"><span class="rag ${t.rag}"></span>
          <span class="nm"><b>${esc(t.name)}</b>${t.stage || t.note ? `<small>${STAGE[t.stage] || ''}${t.note ? '' : ''}</small>` : ''}
            ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}</span>
          ${t.due !== null && t.due !== undefined ? `<span class="tag">${t.due <= 0 ? 'due' : `${t.due}d`}</span>` : ''}</div>`).join('')}
          ${u.note ? `<div class="note">${esc(u.note)}</div>` : ''}</div></details>`;
    }).join('')).join('')}</div>`).join('');
}

function viewWeek() {
  const w = DATA.week || { total: 0, per: {} };
  const names = DATA.subjectNames || {};
  const max = Math.max(1, ...Object.values(w.per));
  return `<div class="card"><h2>This week</h2>
    <div class="row"><span class="nm"><b>${fmtMins(w.total || 0)}</b><small>${DATA.streak ? `${DATA.streak}-day streak` : 'no streak'}</small></span></div>
    ${Object.entries(w.per).map(([k, v]) => `<div class="row"><span class="nm"><b>${esc(names[k] || k)}</b>
      <div class="ragbar"><i class="green" style="width:${v / max * 100}%"></i></div></span><span class="tag">${fmtMins(v)}</span></div>`).join('') || '<div class="empty">Nothing logged yet this week.</div>'}
  </div>
  <div class="card"><h2>Progress</h2>
    ${DATA.subjects.map(s => { const all = s.courses.flatMap(c => c.units.flatMap(u => u.topics)); const c2 = counts(all);
      return `<div class="row"><span class="nm"><b>${esc(s.name)}</b><small>${c2.green} green · ${c2.amber} amber · ${c2.red} red · ${c2.none} unrated</small>${ragBar(c2)}</span></div>`; }).join('')}
  </div>`;
}

function render() {
  $('#main').innerHTML = tab === 'due' ? viewDue() : tab === 'subjects' ? viewSubjects() : viewWeek();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
}

document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
$('#go').addEventListener('click', () => load($('#pw').value, $('#remember').checked));
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') load($('#pw').value, $('#remember').checked); });
let saved = null;
try { saved = localStorage.getItem(KEY); } catch {}
if (saved) { $('#pw').value = saved; load(saved, true); }
</script>
</body>
</html>
